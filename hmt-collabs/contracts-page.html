<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMT Collabs · Contracts & Renewals</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;line-height:1.5;color:#263c4b;background:#f4f7f9}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:4px solid #00a5b5;padding:22px max(22px,calc((100vw - 1180px)/2))}a{color:#087c88}h1{margin:12px 0 6px;font-size:clamp(28px,3vw,32px);font-weight:600}h2{font-size:22px;font-weight:600;margin:0 0 16px}main{max-width:1180px;margin:26px auto;padding:0 20px}.subtitle,small{color:#52677b}.module-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:22px 0}.nav-tile{background:#fff;color:#263c4b;border:1px solid #dce6ed;border-left:4px solid #00a5b5;border-radius:12px;padding:18px;text-align:left;min-height:105px;margin:0;box-shadow:0 2px 8px #102c3a0a}.nav-tile strong{display:block;font-size:17px}.nav-tile small{display:block;font-size:13px;margin-top:6px}.nav-tile[aria-pressed=true]{background:#e9f7f8;border-color:#008e9a}.card{background:white;border:1px solid #dce6ed;border-radius:14px;padding:22px;margin:18px 0;overflow:auto}.toolbar,.panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.panel-head h2{margin:0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 18px}label{display:block;margin:12px 0 5px;font-size:14px;font-weight:500}input,select,textarea,button{font:inherit;padding:11px 12px;border:1px solid #c7d6e0;border-radius:7px}input,select,textarea{width:100%;background:#fff;color:#263c4b}textarea{min-height:90px}button{cursor:pointer;min-height:42px;background:#008e9a;color:#fff;border:0;margin:10px 7px 0 0}button.secondary{background:#52677b}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #005c75;outline-offset:2px}.notice{padding:12px;background:#e7f7f8;border-radius:9px;margin:15px 0;white-space:pre-wrap}.error{background:#ffecec;color:#9a2020}.stats{display:flex;gap:14px;flex-wrap:wrap}.stat{background:#e9f6f7;padding:15px;border-radius:10px;min-width:145px}.stat strong{display:block;color:#007c86;font-size:26px}.selected{background:#e9f6f7;padding:16px;border-radius:10px;margin:18px 0}.record{border-bottom:1px solid #dce6ed;padding:16px 0}.record dl{display:grid;grid-template-columns:minmax(100px,180px) 1fr;gap:6px}.record dt{color:#52677b}.record dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e7edf1}th{background:#f3f8fa}.pill{display:inline-block;border-radius:10px;padding:4px 8px;background:#e8f5f7}.late{background:#ffecec;color:#9a2020}[hidden]{display:none!important}@media(max-width:600px){.module-nav,.fields{grid-template-columns:1fr}.card{padding:16px}.record dl{grid-template-columns:1fr}.record dd{margin-bottom:8px}}
</style></head><body><header><a href="/">← HMT Collabs</a><h1>Contracts & Renewals</h1><div class="subtitle">Customer and supplier contracts, service commitments and renewal follow-up</div></header><main><div id="message" role="status" aria-live="polite"></div><section class="card" id="loginpanel" hidden><h2>Sign in</h2><form id="loginform"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><div id="workspace" hidden><div class="toolbar"><span id="identity"></span><button class="secondary" id="refresh">Refresh</button><button class="secondary" id="logout">Sign out</button></div><nav class="module-nav" id="nav" aria-label="Contract functions"></nav><section class="card" id="overview"><h2>Contract lifecycle management</h2><p>Select a function above. Link contracts to an organization, record service commitments and prepare renewals before coverage expires.</p><div class="stats" id="stats"></div><p id="scope"></p></section><section id="panel" hidden><div class="panel-head"><button class="secondary" id="back">← All functions</button><h2 id="paneltitle"></h2></div><div id="content"></div></section></div></main><script type="module">
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=v=>String(v).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
const functions=[['register','Contract register','Search, filter and export all accessible contracts'],['profile','Contract details','Create contracts, assign owners and manage commercial terms'],['coverage','Coverage & entitlements','Equipment, licenses, sites, warranties and exclusions'],['sla','SLAs & service commitments','Priorities, service hours, targets and escalation contacts'],['renewal','Renewal pipeline','Quotations, negotiations, purchase orders and outcomes'],['reminders','Expiry & notice reminders','90/60/30-day expiry windows and cancellation deadlines'],['obligation','Obligations & deliverables','Owners, due dates, recurring commitments and completion'],['document','Documents & references','Signed agreements, quotations and supporting document links'],['workflows','Automations & workflows','Scheduled alerts, in-app notifications and acknowledgement'],['reports','Contract reports','Coverage risks and contract values by currency'],['audit','Change history','Recorded changes, dates and authors']];
let meta={},items=[],selected='',active='',details=null,editing='',filter={q:'',status:'',country:''};
const current=()=>items.find(x=>x.id===selected),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Indian/Mauritius'});
const days=c=>Math.round((Date.parse(c.end_date+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/86400000);
const tell=(s,error=false)=>{$('message').textContent=s;$('message').className=s?'notice'+(error?' error':''):''};
async function api(path,data){const opts={credentials:'same-origin'};if(data!==undefined){opts.method='POST';opts.headers={'content-type':'application/json'};opts.body=JSON.stringify(data)}const r=await fetch(path,opts),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j;}
const options=(values,value)=>values.map(v=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(title(v))+'</option>').join('');
const labels={amount:'Total contract value',notice_days:'Cancellation notice period (days)',auto_renew:'Automatic renewal clause',response_minutes:'Response target (minutes)',resolution_minutes:'Resolution target (minutes)',document_url:'Document URL (HTTP/HTTPS)',contact:'Contract contact',quantity:'Quantity / license count'};
function field(k,value='',required=false,list=null){const label=labels[k]||title(k),attrs=' name="'+k+'" '+(required?'required ':'');let control;if(list)control='<select'+attrs+'>'+(!required?'<option value="">Not specified</option>':'')+options(list,value)+'</select>';else if(['scope','exclusions','notes','measurement','penalties'].includes(k))control='<textarea'+attrs+' maxlength="4000">'+esc(value)+'</textarea>';else{const type=k.includes('date')||['coverage_start','coverage_end'].includes(k)?'date':k==='document_url'?'url':['amount','quoted_amount','quantity','response_minutes','resolution_minutes','notice_days'].includes(k)?'number':'text';control='<input'+attrs+' type="'+type+'" value="'+esc(value)+'" maxlength="1000" '+(type==='number'?'min="0" step="'+(k==='notice_days'?'1':'0.01')+'"':'')+'>';}return '<label>'+esc(label)+(required?' *':'')+control+'</label>';}
function table(head,rows){return rows.length?'<table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p>No records found.</p>';}
function picker(){return '<div class="selected"><label>Contract<select id="contractselect"><option value="">Select a contract</option>'+items.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===selected?'selected':'')+'>'+esc(c.reference+' · '+c.title+' · '+c.organization_name)+'</option>').join('')+'</select></label></div>';}
function filtered(){return items.filter(c=>(!filter.q||[c.reference,c.title,c.organization_name,c.owner].join(' ').toLowerCase().includes(filter.q.toLowerCase()))&&(!filter.status||c.status===filter.status)&&(!filter.country||c.country_code===filter.country));}
function contractRows(rows){return rows.map(c=>[esc(c.reference),esc(c.title),esc(c.organization_name),esc(c.country_code),'<span class="pill">'+esc(title(c.status))+'</span>',esc(c.end_date)+(days(c)<0?' <span class="pill late">Date passed</span>':''),esc(c.amount?c.currency+' '+Number(c.amount).toLocaleString():c.currency+' —'),'<button data-open="'+esc(c.id)+'">Open</button>']);}
function renderRegisterRows(){$('rows').innerHTML=table(['Reference','Contract','Organization','Country','Status','End date','Value',''],contractRows(filtered()));bindOpen();}
const safeLink=v=>{try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?'<a href="'+esc(u.href)+'" target="_blank" rel="noopener noreferrer">Open document</a>':esc(v)}catch{return esc(v)}};
function report(){const totals={};for(const c of items.filter(c=>c.status==='active')){const x=totals[c.currency]||{count:0,value:0};x.count++;x.value+=Number(c.amount||0);totals[c.currency]=x;}return '<section class="card"><h2>Regional reporting</h2><p><a href="/module/reporting#financial/contract-values">Financial contract reports</a> · <a href="/module/reporting#technical/contract-coverage">Coverage & service reports</a> · <a href="/module/reporting#audit/contract-audit">Contract audit</a></p></section><section class="card"><h2>Active contract values</h2><p>Values are total contract amounts, grouped by currency. They are not annualized or converted.</p>'+table(['Currency','Contracts','Total value'],Object.entries(totals).map(([currency,x])=>[esc(currency),x.count,esc(x.value.toLocaleString(undefined,{maximumFractionDigits:2}))]))+'</section><section class="card"><h2>Coverage needing review</h2>'+table(['Reference','Organization','End date','Recorded status'],items.filter(c=>['active','on_hold','expired'].includes(c.status)&&days(c)<=90).map(c=>[esc(c.reference),esc(c.organization_name),esc(c.end_date),esc(title(c.status))]))+'</section>';}
async function show(key){active=key;editing='';$('overview').hidden=!!key;$('panel').hidden=!key;document.querySelectorAll('[data-panel]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.panel===key)));history.replaceState(null,'','#'+key);if(!key)return;$('paneltitle').textContent=functions.find(x=>x[0]===key)[1];await render();}
async function render(){let c=current(),html='';
 if(active==='register'){html='<section class="card"><div class="fields"><label>Search<input id="search" value="'+esc(filter.q)+'" placeholder="Reference, title, organization or owner"></label><label>Status<select id="statusfilter"><option value="">All statuses</option>'+options(meta.statuses,filter.status)+'</select></label><label>Country<select id="countryfilter"><option value="">All countries</option>'+options(meta.countries,filter.country)+'</select></label></div><button id="export">Export filtered CSV</button>'+(meta.can_write?'<button id="new">New contract</button>':'')+'<div id="rows"></div></section>';}
 else if(active==='reminders'){html='<section class="card"><p>Reminders are shown when this page loads or refreshes. Scheduled workflow alerts run daily at 08:00 Mauritius time and after contract saves. Expiry windows are grouped as 0–30, 31–60 and 61–90 days. Notice deadlines use the cancellation notice period recorded on each contract.</p><p>Authorized administrators and country leads receive in-app workflow notifications. Email delivery is not configured for this module.</p>'+table(['Reference','Organization','Reminder','Due date','Days remaining','Owner',''],meta.alerts.map(a=>[esc(a.reference),esc(a.organization_name),'<span class="pill '+(a.days<0?'late':'')+'">'+esc(a.category)+'</span>',esc(a.date),a.days,esc(a.owner||'Unassigned'),'<button data-open="'+esc(a.contract_id)+'">Open</button>']))+'</section>';}
 else if(active==='workflows'){
 const w=await api('/api/contract-workflows'+(selected?'?contract_id='+encodeURIComponent(selected):''));
 html=picker()+'<section class="card"><p>'+esc(w.schedule)+' · In-app notifications for administrators and assigned country leads. Alerts resolve when their conditions clear. Acknowledging an alert records review; it does not resolve the underlying work.</p>'+(w.can_write?'<button id="scanworkflows">Run scan for my authorized countries</button>':'')+table(['Contract','Organization','Rule','Message','Due','Severity','Status',''],w.items.map(a=>[esc(a.reference),esc(a.organization_name),esc(title(a.rule)),esc(a.message),esc(a.due_date||'—'),esc(a.severity),esc(a.status),w.can_write&&a.status==='open'?'<button data-ack="'+esc(a.id)+'">Acknowledge</button>':'']))+'</section><section class="card"><h2>Active rules</h2>'+table(['Rule','Trigger'],w.rules.map(r=>[esc(title(r.id)),esc(r.description)]))+'</section><section class="card"><h2>Recent workflow scans</h2>'+table(['Started UTC','Status','Evaluated contracts','Opened/reopened','Resolved'],w.runs.map(r=>[esc(r.started_at),esc(r.status),r.evaluated,r.opened,r.resolved]))+'<p>Country leads see their manual scans here. Scheduled scan history is available to global administrators.</p></section>';
 }
 else if(active==='reports')html=report();
 else {html=picker();if(active==='profile'){
 const v=c||{};if(!meta.can_write&&!c)html+='<section class="card">Select a contract to view its details.</section>';else html+='<section class="card"><h2>'+(c?'Contract details':'New contract')+'</h2>'+(meta.can_write?'':'<p>Read-only access</p>')+'<form id="profileform"><fieldset '+(!meta.can_write?'disabled':'')+' style="border:0;padding:0"><div class="fields"><label>Organization *<select name="customer_id" required '+(c?'disabled':'')+'><option value="">Select an organization</option>'+meta.organizations.map(o=>'<option value="'+esc(o.id)+'" '+(v.customer_id===o.id?'selected':'')+'>'+esc(o.name+' · '+o.country_code)+'</option>').join('')+'</select></label>'+field('reference',v.reference,true)+field('title',v.title,true)+field('contract_type',v.contract_type||'support',true,meta.types)+field('status',v.status||'draft',true,meta.statuses)+field('start_date',v.start_date,true)+field('end_date',v.end_date,true)+field('currency',v.currency||'MUR',true)+field('amount',v.amount)+field('owner',v.owner)+field('technical_owner',v.technical_owner)+field('contact',v.contact)+field('billing_frequency',v.billing_frequency,false,['one_off','monthly','quarterly','half_yearly','annual','other'])+field('payment_terms',v.payment_terms)+field('po_reference',v.po_reference)+field('notice_days',v.notice_days||'0')+field('auto_renew',v.auto_renew||'no',false,['yes','no'])+field('document_url',v.document_url)+field('scope',v.scope)+field('exclusions',v.exclusions)+field('notes',v.notes)+'</div>'+(meta.can_write?'<button>Save contract</button><button type="button" class="secondary" id="clear">Create another</button>':'')+'</fieldset></form><p>Renewal outcomes are tracked separately. Review and update contract dates after a signed renewal. Statuses are maintained manually; passed end dates remain visible.</p></section>';
 }else if(!c)html+='<section class="card">Select a contract to manage this function.</section>';else{
 details=await api('/api/contracts/detail?id='+encodeURIComponent(selected));
 if(active==='audit')html+='<section class="card">'+table(['Change','Author','Timestamp (UTC)'],details.audit.map(a=>[esc(a.action),esc(a.actor||'Unknown'),esc(a.created_at)]))+'<p>Most recent 100 changes.</p></section>';
 else {const rows=details.entries.filter(x=>x.kind===active);html+='<section class="card">'+(active==='renewal'?'<p>Track each renewal cycle as its own record. Confirming a renewal does not automatically change the contract dates.</p>':'')+(rows.length?rows.map(x=>'<article class="record"><h3>'+esc(x.data.name)+'</h3><dl>'+Object.entries(x.data).filter(([k,v])=>v&&k!=='name').map(([k,v])=>'<dt>'+esc(labels[k]||title(k))+'</dt><dd>'+(k==='document_url'?safeLink(v):esc(v))+'</dd>').join('')+'</dl>'+(meta.can_write?'<button data-edit="'+esc(x.id)+'">Edit</button>':'')+'</article>').join(''):'<p>No records yet.</p>')+'</section>'+(meta.can_write?'<section class="card"><h2 id="entryheading">Add '+esc(title(active))+'</h2><form id="entryform"><div class="fields" id="entryfields"></div><button>Save record</button><button class="secondary" id="cancelentry" type="button">Clear</button></form></section>':'');}
 }}
 $('content').innerHTML=html;
 if($('contractselect'))$('contractselect').onchange=async e=>{selected=e.target.value;editing='';try{await render()}catch(e){tell(e.message,true)}};
 if(active==='register'){renderRegisterRows();$('search').oninput=e=>{filter.q=e.target.value;renderRegisterRows()};$('statusfilter').onchange=e=>{filter.status=e.target.value;renderRegisterRows()};$('countryfilter').onchange=e=>{filter.country=e.target.value;renderRegisterRows()};$('export').onclick=exportCSV;if($('new'))$('new').onclick=()=>{selected='';show('profile').catch(e=>tell(e.message,true))};}
 if($('profileform'))$('profileform').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(c)data.customer_id=c.customer_id;await save(e.target,async()=>{const r=await api('/api/contracts/save',{...data,contract_id:selected});selected=r.id;await load();await render()});};
 if($('clear'))$('clear').onclick=()=>{selected='';render().catch(e=>tell(e.message,true))};
 if($('entryform')){entryForm();$('entryform').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));await save(e.target,async()=>{await api('/api/contracts/entry',{...data,kind:active,contract_id:selected,entry_id:editing});editing='';await render()});};$('cancelentry').onclick=()=>{editing='';entryForm()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;entryForm(details.entries.find(x=>x.id===editing).data);$('entryform').scrollIntoView({behavior:'smooth',block:'start'})});}
 if($('scanworkflows'))$('scanworkflows').onclick=async()=>{const b=$('scanworkflows');b.disabled=true;try{const r=await api('/api/contract-workflows/scan',{});await render();tell('Scan complete: '+r.opened+' opened/reopened, '+r.resolved+' resolved.')}catch(e){tell(e.message,true)}finally{b.disabled=false}};
 document.querySelectorAll('[data-ack]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/api/contract-workflows/acknowledge',{id:b.dataset.ack});await render();tell('Alert acknowledged.')}catch(e){tell(e.message,true);b.disabled=false}});
 bindOpen();}
function entryForm(v={}){$('entryheading').textContent=(editing?'Edit ':'Add ')+title(active);$('entryfields').innerHTML=meta.entry_fields[active].map(k=>field(k,v[k]??(k==='currency'?current().currency:''),k==='name'||k==='stage'||k==='status',k==='stage'?['not_started','preparing','quotation_sent','negotiation','awaiting_po','confirmed','lost','cancelled']:k==='status'?['pending','in_progress','completed','waived']:k==='priority'?['critical','high','medium','low']:null)).join('');}
async function save(form,action){const b=form.querySelector('button');b.disabled=true;tell('Saving…');try{await action();tell('Saved successfully.')}catch(e){tell(e.message,true)}finally{b.disabled=false}}
function bindOpen(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selected=b.dataset.open;show('profile').catch(e=>tell(e.message,true))});}
function exportCSV(){const keys=['reference','title','organization_name','country_code','contract_type','status','start_date','end_date','currency','amount','owner','notice_days','auto_renew'];const cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replaceAll('"','""')+'"';const csv=[keys,...filtered().map(c=>keys.map(k=>c[k]))].map(row=>row.map(cell).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='HMT-Contracts-'+today()+'.csv';a.click();URL.revokeObjectURL(u);}
async function load(){meta=await api('/api/contracts');items=meta.items;if(selected&&!current())selected='';$('stats').innerHTML=[['Contracts',items.length],['Active',items.filter(x=>x.status==='active').length],['Expiry ≤90 days',items.filter(c=>['active','on_hold','expired'].includes(c.status)&&days(c)>=0&&days(c)<=90).length],['Expired dates',items.filter(c=>['active','on_hold','expired'].includes(c.status)&&days(c)<0).length]].map(([label,n])=>'<div class="stat">'+esc(label)+'<strong>'+n+'</strong></div>').join('');$('scope').textContent=meta.can_write?'You can manage contracts within your country access.':'Read-only access within your country access.';}
async function init(){try{const me=await api('/api/auth/me');await load();$('identity').textContent=me.user.display_name+' · '+me.user.roles.join(', ');$('loginpanel').hidden=true;$('workspace').hidden=false;$('nav').innerHTML=functions.map(([key,label,desc])=>'<button class="nav-tile" data-panel="'+key+'" aria-pressed="false"><strong>'+esc(label)+'</strong><small>'+esc(desc)+'</small></button>').join('');document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>show(b.dataset.panel).catch(e=>tell(e.message,true)));const key=location.hash.slice(1);await show(functions.some(x=>x[0]===key)?key:'');tell('')}catch(e){$('workspace').hidden=true;$('loginpanel').hidden=false;tell(e.message,true)}}
$('loginform').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',Object.fromEntries(new FormData(e.target)));await init()}catch(e){tell(e.message,true)}};$('back').onclick=()=>show('');$('refresh').onclick=async()=>{try{await load();if(active)await render();tell('Refreshed.')}catch(e){tell(e.message,true)}};$('logout').onclick=async()=>{try{await api('/api/auth/logout',{});location.reload()}catch(e){tell(e.message,true)}};init();
</script></body></html>
